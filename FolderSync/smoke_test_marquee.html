<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder Sync Path Marquee Smoke Test</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 32px; background: #101216; color: #e8eaf0; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 0 24px; }
    .card { max-width: 760px; margin: 0 auto 18px; padding: 24px 28px; border-radius: 18px; background: #34373d; }
    .path-row { display: flex; align-items: center; gap: 12px; min-width: 0; margin: 12px 0; }
    .icon { flex: 0 0 32px; font-size: 26px; text-align: center; }
    .path-window { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
    .path-track { display: inline-flex; white-space: nowrap; animation: marquee 12s ease-in-out infinite alternate; }
    .path-track span { padding-right: 80px; }
    .short .path-track { animation: none; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(min(0px, calc(100% - 100%))); } }
    /* Use a measured long-path offset for the smoke-test example. */
    .long .path-track { animation-name: long-marquee; }
    @keyframes long-marquee { from { transform: translateX(0); } to { transform: translateX(var(--distance, -360px)); } }
    .label { color: #b9c0cf; font-size: 14px; margin-bottom: 4px; }
    .direction { text-align: center; color: #bdc7ff; font-size: 20px; margin: 18px 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Folder Sync</h1>
    <div class="path-row short">
      <div class="icon">📱</div>
      <div class="path-window"><div class="path-track"><span>primary:DCIM</span></div></div>
    </div>
    <div class="path-row long">
      <div class="icon">💻</div>
      <div class="path-window"><div class="path-track"><span>C:\Users\nahid\Pictures\From_Redmi12\DCIM\Camera\2026\September\Long Folder Name\</span><span>C:\Users\nahid\Pictures\From_Redmi12\DCIM\Camera\2026\September\Long Folder Name\</span></div></div>
    </div>
    <div class="direction">📱　→　Copy &amp; Delete　→　💻</div>
  </main>
  <script>
    function sizeMarquee() {
      document.querySelectorAll('.long .path-window').forEach(windowEl => {
        const track = windowEl.querySelector('.path-track');
        const distance = Math.min(0, windowEl.clientWidth - track.scrollWidth + 80);
        track.style.setProperty('--distance', `${distance}px`);
      });
    }
    addEventListener('load', sizeMarquee);
    addEventListener('resize', sizeMarquee);
  </script>
</body>
</html>
